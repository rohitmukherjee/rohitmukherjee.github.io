<header class="site-header">
  <div class="wrap header-row">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/tools/' | relative_url }}">Tools</a>
      {% comment %} Uncomment when ready:
      <a href="{{ '/#essays' | relative_url }}">Essays</a>
      <a href="{{ '/cv/' | relative_url }}">CV</a>
      {% endcomment %}
    </nav>
    <div class="theme-picker" role="group" aria-label="Color theme">
      <button type="button" data-theme="light" title="Light" aria-label="Light theme">L</button>
      <button type="button" data-theme="dark"  title="Dark"  aria-label="Dark theme">D</button>
      <button type="button" data-theme="ft"    title="Financial Times" aria-label="Financial Times theme">FT</button>
    </div>
  </div>
</header>
